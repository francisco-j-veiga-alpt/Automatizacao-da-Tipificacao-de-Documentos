services:
  web:
    build: ./app/backend/
    ports:
      - "8000:80"
    volumes:
      - ./app/backend/src:/app/backend/src
    depends_on:
      - mongo_db
  mongo_db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ./app/mongo_db/mongo_data:/data/db
      - ./app/mongo_db/configdb:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin1234
  frontend:
    build: ./app/frontend
    ports:
      - "3000:3000"
    depends_on:
      - web
    environment:
      - CHOKIDAR_USEPOOLING=true
      - NODE_OPTIONS=--openssl-legacy-provider
    volumes:
      - ./app/frontend:/app/frontend
      - node_modules:/app/node_modules
      - ./public:/app/public
volumes:
  node_modules:
