<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Add this CSP meta tag to handle extension conflicts -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' http://localhost:3000;
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data:;
                   font-src 'self';
                   connect-src 'self' http://localhost:8000;">
    <meta charset="utf-8" />
    <title>Client Feedback Analytics</title>
  </head>
  <body>
    <!-- This is the critical element React needs to mount to -->
    <div id="root"></div>
  </body>
</html>
